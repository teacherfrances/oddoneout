:root{
  --fs:28px;
  --ink:#0B2A4A; --grey:#4A6378; --line:#BAE4F0;
  --easy:#0091B9; --easyt:#E6F4FA; --easyd:#00708F;
  --medium:#FF6500; --mediumt:#FFF0E0; --mediumd:#B34700;
  --hard:#004E9B; --hardt:#E1ECF7; --hardd:#003A75;
  --display:"Outfit","Segoe UI Black","Arial Black","Segoe UI",Carlito,Calibri,system-ui,sans-serif;
  --body:"Figtree",Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{background:#0091B9;min-height:100%}
body{margin:0;font-family:var(--body);font-weight:600;font-size:var(--fs);color:var(--ink);line-height:1.3;min-height:100vh;position:relative;
  padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 7% 22%, #BAE4F0 0, #FF6500 70px, transparent 71px),
    radial-gradient(circle at 94% 14%, #FFE27A 0, #FF6500 85px, transparent 86px),
    radial-gradient(circle at 88% 82%, #5FB8D6 0, #004E9B 130px, transparent 131px),
    radial-gradient(circle at 12% 88%, #5FB8D6 0, #004E9B 110px, transparent 111px),
    radial-gradient(circle at 48% 92%, #FFE27A 0, #FF6500 70px, transparent 71px),
    radial-gradient(circle at 78% 46%, #FFE27A 0, #FF6500 30px, transparent 31px),
    radial-gradient(circle at 55% 60%, rgba(255,255,255,.10) 0, rgba(255,255,255,.10) 240px, transparent 241px),
    radial-gradient(rgba(255,255,255,.45) 2.5px, transparent 3px),
    linear-gradient(135deg,#004E9B 0%,#0091B9 40%,#0091B9 80%,#BAE4F0 100%);
  background-size:auto,auto,auto,auto,auto,auto,auto,64px 64px,auto}
button{font:inherit;font-size:1em;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:5px solid #FFD500;outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
.hidden{display:none!important}

/* ===== top bar ===== */
.top{position:sticky;top:0;z-index:10;padding:calc(.3em + env(safe-area-inset-top,0px)) .6em .3em;color:#fff;
  display:flex;align-items:center;gap:.5em;flex-wrap:wrap;
  background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:2px solid rgba(255,255,255,.35);box-shadow:0 8px 30px rgba(0,40,90,.18)}
.brand{display:flex;align-items:center;gap:.35em;margin-right:auto;flex-wrap:wrap}
.logo{font-size:1.25em}
.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.15em;text-shadow:0 3px 10px rgba(0,40,90,.25)}
.top h1 .the{background:#FF6500;padding:.02em .3em .08em;border-radius:6px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.top h1 .seat{color:#FFD500;text-shadow:0 3px 0 rgba(160,60,0,.35)}
.tbtn{min-height:64px;min-width:64px;padding:0 .55em;border-radius:14px;border:3px solid rgba(255,255,255,.6);background:rgba(255,255,255,.16);color:#fff;font-weight:800}
.tbtn[aria-pressed="true"]{background:#fff;color:#E05500;border-color:#fff}
.sizes{display:flex;gap:.25em}
.sizes .tbtn{font-family:var(--display);font-weight:700;padding:0 .35em}

main{max-width:1500px;margin:0 auto;padding:.8em .8em 2em}
.card{background:#fff;border-radius:26px;box-shadow:0 18px 40px rgba(0,40,90,.22);padding:.7em .8em .8em}
.stack{display:grid;gap:.8em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.ct{font-family:var(--display);font-weight:700;margin:0 0 .45em;font-size:1em;color:var(--ink);display:flex;align-items:center;gap:.3em;flex-wrap:wrap}
.ct .n{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;
  background:linear-gradient(135deg,#FF8A00,#FF6500);color:#fff;font-size:.8em;flex:none}
.opts{display:flex;flex-wrap:wrap;gap:.4em}
.opt{min-height:68px;padding:0 .8em;border-radius:999px;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B}
.opt[aria-pressed="true"]{background:linear-gradient(135deg,#0091B9,#004E9B);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(0,78,155,.3)}
.opt.lv-easy[aria-pressed="true"]{background:linear-gradient(135deg,#0091B9,#0091B9)}
.opt.lv-medium[aria-pressed="true"]{background:linear-gradient(135deg,#FF6500,#FFD500)}
.opt.lv-hard[aria-pressed="true"]{background:linear-gradient(135deg,#004E9B,#FF6500)}
.small{min-height:58px;padding:0 .6em;border-radius:999px;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B;font-size:.75em}
.tchips{display:flex;flex-wrap:wrap;gap:.4em}
.tchip{min-height:64px;padding:0 .7em;border-radius:999px;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B;display:inline-flex;align-items:center;gap:.3em}
.tchip .cnt{font-size:.68em;background:#E6F4FA;color:#004E9B;border-radius:999px;padding:0 .45em}
.tchip[aria-pressed="true"]{background:linear-gradient(135deg,#004E9B,#0091B9);border-color:transparent;color:#fff}
.tchip[aria-pressed="true"] .cnt{background:rgba(255,255,255,.3);color:#fff}
.tchip.settle[aria-pressed="true"]{background:linear-gradient(135deg,#FF6500,#FF6500)}
.group{margin:.5em 0 .3em;font-family:var(--display);font-weight:700;font-size:.85em;display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.group .mini{margin-left:auto;display:flex;gap:.3em}
.sub{color:var(--grey);font-size:.82em;margin:.45em 0 0;font-weight:700}
.toggle{min-height:64px;padding:0 .75em;border-radius:999px;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B}
.toggle[aria-pressed="true"]{background:linear-gradient(135deg,#FF6500,#FFD500);color:#fff;border-color:transparent}
.go{min-height:84px;padding:0 1.1em;border:0;border-radius:999px;color:#fff;font-family:var(--display);font-weight:700;font-size:1.1em;
  background:linear-gradient(135deg,#FF8A00,#FF6500 50%,#0091B9);box-shadow:0 6px 0 #B34700,0 14px 28px rgba(255,101,0,.35)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #B34700}
.plain{min-height:64px;padding:0 .8em;border-radius:999px;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B}
.blue{min-height:64px;padding:0 .9em;border-radius:999px;border:0;color:#fff;font-weight:800;background:linear-gradient(135deg,#004E9B,#0091B9);box-shadow:0 5px 0 #003A75}
.bar{display:flex;gap:.6em;justify-content:center;flex-wrap:wrap}
.match{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;justify-content:space-between}
.match b{font-family:var(--display);font-weight:700;color:#FF6500}
.meter{height:.55em;border-radius:999px;background:#E6F4FA;margin:.5em 0 0;overflow:hidden}
.meter span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FF8A00,#FF6500 55%,#0091B9)}
.custom{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;margin-top:.6em}
.custom .lab{font-weight:800;color:var(--grey);font-size:.85em}
.stepper{display:inline-flex;align-items:center;gap:.25em;background:#E6F4FA;border-radius:999px;padding:.2em .3em}
.stepper button{min-width:64px;height:64px;padding:0 .3em;border-radius:999px;border:3px solid var(--line);background:#fff;font-family:var(--display);font-weight:700;color:#004E9B}
.stepper .v{min-width:2.2em;text-align:center;font-family:var(--display);font-weight:700;font-size:1.15em;border-radius:999px;padding:.05em .3em}
.stepper .v.on{background:linear-gradient(135deg,#0091B9,#004E9B);color:#fff}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,11em),1fr));gap:.5em;margin-top:.6em}
.teamrow{display:flex;gap:.4em;align-items:center;border-radius:18px;padding:.25em .4em;background:#F2FAFD}
.sw{width:.9em;height:.9em;border-radius:50%;flex:none;box-shadow:0 0 0 3px #fff}
.teamrow input{flex:1;min-width:0;font:inherit;font-size:1em;font-weight:800;padding:.15em .45em;border:3px solid var(--line);border-radius:14px;color:var(--ink);min-height:60px;background:#fff}
.names{width:100%;margin-top:.5em;font:inherit;font-size:1em;font-weight:800;color:var(--ink);background:#F2FAFD;border:3px solid var(--line);border-radius:18px;padding:.35em .55em;min-height:6.5em;resize:vertical;line-height:1.35}

/* chips */
.chips{display:flex;gap:.35em;flex-wrap:wrap;justify-content:center}
.chip{font-size:.7em;font-weight:800;border-radius:999px;padding:.15em .65em;background:#E6F4FA;color:#004E9B}
.chip.settle{background:#FFF0E0;color:#B34700}
.chip.lv{background:var(--lt);color:var(--ld)}
.lv-easy{--lc:var(--easy);--lt:var(--easyt);--ld:var(--easyd)}
.lv-medium{--lc:var(--medium);--lt:var(--mediumt);--ld:var(--mediumd)}
.lv-hard{--lc:var(--hard);--lt:var(--hardt);--ld:var(--hardd)}

/* ===== play ===== */
.qhead{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;color:#fff;font-weight:800;text-shadow:0 2px 6px rgba(0,40,90,.35)}
.qhead .pill{background:#fff;color:var(--ink);text-shadow:none;border-radius:999px;padding:.1em .7em;font-family:var(--display);font-weight:700}
.dots{display:flex;gap:.3em;flex-wrap:wrap}
.dots span{width:.55em;height:.55em;border-radius:50%;background:rgba(255,255,255,.5)}
.dots span.on{background:#fff;box-shadow:0 0 0 3px #FF6500}
.dots span.done{background:#FFE27A}
.playrow{display:grid;grid-template-columns:1fr auto;gap:.8em;align-items:start;margin-top:.6em}
@media (max-width:900px){.playrow{grid-template-columns:1fr}}
.qcard{text-align:center;padding:.8em .8em 1em;border-top:16px solid var(--lc)}
.qcard h2{margin:.35em 0 .55em;font-family:var(--display);font-weight:700;font-size:1.3em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.tile{min-height:3.3em;border-radius:24px;border:4px solid var(--line);background:#F2FAFD;font-family:var(--display);font-weight:700;font-size:1.25em;color:var(--ink);
  padding:.2em .5em;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:.35em;transition:transform .15s}
.tile:not(:disabled):hover{transform:translateY(-2px)}
.tile:disabled{opacity:1;cursor:default}
.tile.right{background:linear-gradient(135deg,#16A34A,#4ADE80);border-color:#fff;color:#fff;box-shadow:0 12px 26px rgba(22,163,74,.4)}
.tile.wrong{background:#FFE4E6;border-color:#E11D48;color:#9F1239}
.tile.dim{opacity:.55}
.starter{margin:.7em 0 0;background:#FFF3EA;border-radius:18px;padding:.4em .6em;font-weight:800;color:#B34700}
.why{margin-top:.7em;background:linear-gradient(135deg,#FFF0E0,#FFF3EA);border-radius:22px;padding:.55em .7em;text-align:left;font-weight:800}
.why b{font-family:var(--display);font-weight:700;color:#C24E00}
.verdict{font-family:var(--display);font-weight:700;font-size:1.1em;margin-top:.5em}
.verdict.ok{color:#16A34A} .verdict.no{color:#E11D48}
.side{display:flex;flex-direction:column;gap:.6em;min-width:9em}
.timerbox{position:relative;width:4.2em;height:4.2em;align-self:center}
.timerbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.timerbox .track{stroke:#E6F4FA}
.timerbox .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.05em}
.timerbox .tt small{font-family:var(--body);font-size:.5em;color:var(--grey);font-weight:800}
.timerbox.low .tt{color:#E11D48}
.who{margin-top:.7em}
.who h3{margin:0 0 .4em;font-family:var(--display);font-weight:700;font-size:.9em}
.tms{display:grid;gap:.5em;grid-template-columns:repeat(auto-fill,minmax(min(100%,8.5em),1fr))}
.tm{min-height:78px;border-radius:22px;border:4px solid #fff;background:#F2FAFD;box-shadow:0 8px 18px rgba(0,40,90,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05em;padding:.2em;font-weight:800}
.tm .nm{display:flex;align-items:center;gap:.3em;font-family:var(--display);font-weight:700}
.tm .st{font-size:.7em;color:var(--grey)}
.tm[aria-pressed="true"]{background:linear-gradient(135deg,#16A34A,#4ADE80);color:#fff}
.tm[aria-pressed="true"] .st{color:#fff}
.nav{display:flex;gap:.6em;justify-content:space-between;flex-wrap:wrap;margin-top:.8em}

/* ===== end ===== */
.scorelist{display:grid;gap:.55em}
.srow{display:flex;align-items:center;gap:.6em;background:#fff;border-radius:24px;padding:.4em .7em;box-shadow:0 12px 26px rgba(0,40,90,.2)}
.srow.first{background:linear-gradient(135deg,#FFF8D6,#FFF1B8)}
.srow .rk{font-size:1.3em;width:1.6em;text-align:center;font-family:var(--display);font-weight:700}
.srow .nm{flex:1;font-family:var(--display);font-weight:700;display:flex;align-items:center;gap:.35em}
.srow .tot{font-family:var(--display);font-weight:700;font-size:1.4em;min-width:2em;text-align:right}
.srow .adj{display:flex;gap:.25em}
.srow .adj button{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B}
.review{list-style:none;margin:0;padding:0;display:grid;gap:.5em;grid-template-columns:repeat(auto-fill,minmax(min(100%,17em),1fr))}
.review li{background:#fff;border-radius:22px;box-shadow:0 12px 26px rgba(0,40,90,.2);padding:.5em .65em;border-left:12px solid var(--lc)}
.review .ws{font-weight:800}
.review .ws s{text-decoration:none;color:#16A34A;font-family:var(--display);font-weight:700}
.review .r{font-size:.8em;color:var(--grey);font-weight:700;margin-top:.2em}

@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.35) both}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
  .shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
}
@media (max-width:640px){
  .top{position:static}
  main{padding:.5em .45em 2em}
  .go{width:100%}
}
/* ===== phone fix: nothing wider than the screen, no sideways wobble ===== */
html,body{max-width:100%;overflow-x:hidden}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-x:none;touch-action:manipulation}
.stack{grid-template-columns:minmax(0,1fr)}
.stack>*,.grid2>*,.card{min-width:0}
.card,.sub,.count{overflow-wrap:break-word}
.letterset{overflow-wrap:anywhere;word-break:break-all}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .stepper{display:flex;width:100%;max-width:26em}
  .stepper button{flex:1 1 0;min-width:0;padding:0}
  .stepper .v{flex:1.2 1 0;min-width:0}
  .custom{flex-direction:column;align-items:stretch}
}
/* ===== phone fix 2: wrap long words and buttons on small screens ===== */
@media (max-width:640px){
  body{font-size:min(var(--fs), 8.5vw)}
  .top h1{font-size:clamp(20px, 6.6vw, 1.15em);overflow-wrap:anywhere}
  .brand{min-width:0;max-width:100%}
  button{max-width:100%}
  .opt,.plain,.blue,.toggle,.go,.small,.hbtn,.tchip,.chip,.tm,.seg button,.tab,.desk,.person,.pchip{white-space:normal;overflow-wrap:anywhere;height:auto}
  .tchip{text-align:left}
  .playrow,.qrow,.roundtop,.tiles,.qlist,.results,.review,.gallery,.cats,.tms{grid-template-columns:minmax(0,1fr)}
  .tile,.answer,.qcard h2,.pcard,.qi .qt,.cat .txt,.bigcat h2,.pickbox,.why,.hint,.label,.checkhead,.qhead,.roundinfo,.ga,.gh{overflow-wrap:anywhere;min-width:0}
  .bt summary{flex-wrap:wrap}
  .cat,.qi .top2,.qi .foot{flex-wrap:wrap}
  .letter{margin:0 auto}
}

    if(tb) tb.textContent = timer.running ? "⏸ Pause" : (timer.left <= 0 ? "🔁 Again" : "▶ Start");
  }

  /* ---------- render ---------- */
  var app = document.getElementById("app");
  function opt(act, val, label, on, cls){
    return '<button class="opt' + (cls ? " " + cls : "") + '" data-act="' + act + '" data-v="' + val + '" aria-pressed="' + (on ? "true" : "false") + '">' + label + "</button>";
  }
  function levelCount(t){ return chosenLevels().reduce(function(n, lv){ return n + t.s[lv].length; }, 0); }
  function chipsFor(x){
    return '<span class="chips"><span class="chip' + (x.topic.group === "settle" ? " settle" : "") + '">' + x.topic.emoji + " " + esc(x.topic.name) + "</span>" +
      '<span class="chip lv lv-' + x.lv + '">' + LV[x.lv].name + "</span></span>";
  }

  function renderHome(){
    var all = pool().length, free = freePool().length;
    var h = '<div class="stack">';
    h += '<div class="card"><h2 class="ct"><span class="n">1</span>Choose the levels</h2><div class="opts">' +
      ["easy", "medium", "hard"].map(function(l){ return opt("level", l, LV[l].name, S.levels[l], "lv-" + l); }).join("") +
      '</div><p class="sub">' + (chosenLevels().map(function(l){ return LV[l].name + ": " + LV[l].desc; }).join(" ") || "Choose at least one level.") + "</p></div>";

    h += '<div class="card"><h2 class="ct"><span class="n">2</span>Choose the topics</h2>';
    [["general", "🌏 General topics"], ["settle", "🇦🇺 Settling in Australia"], ["words", "🔤 Word skills"]].forEach(function(g){
      h += '<div class="group">' + g[1] + '<span class="mini"><button class="small" data-act="groupAll" data-v="' + g[0] + '">All</button><button class="small" data-act="groupNone" data-v="' + g[0] + '">None</button></span></div><div class="tchips">';
      TOPICS.filter(function(t){ return t.group === g[0]; }).forEach(function(t){
        h += '<button class="tchip' + (t.group === "settle" ? " settle" : "") + '" data-act="topic" data-v="' + t.id + '" aria-pressed="' + (!!S.topics[t.id]) + '">' + t.emoji + " " + esc(t.name) + ' <span class="cnt">' + levelCount(t) + "</span></button>";
      });
      h += "</div>";
    });
    h += "</div>";

    var presets = [5, 10, 15, 20];
    h += '<div class="grid2"><div class="card"><h2 class="ct"><span class="n">3</span>How many rounds?</h2><div class="opts">' +
      presets.map(function(n){ return opt("count", n, n, S.count === n); }).join("") +
      '</div><div class="custom"><span class="lab">Or choose your own number:</span><div class="stepper">' +
      '<button data-act="countStep" data-d="-5" aria-label="5 fewer"' + (S.count <= 1 ? " disabled" : "") + '>−5</button>' +
      '<button data-act="countStep" data-d="-1" aria-label="1 fewer"' + (S.count <= 1 ? " disabled" : "") + '>−</button>' +
      '<span class="v' + (presets.indexOf(S.count) < 0 ? " on" : "") + '">' + S.count + "</span>" +
      '<button data-act="countStep" data-d="1" aria-label="1 more"' + (S.count >= MAXQ ? " disabled" : "") + '>+</button>' +
      '<button data-act="countStep" data-d="5" aria-label="5 more"' + (S.count >= MAXQ ? " disabled" : "") + ">+5</button></div></div></div>";
    h += '<div class="card"><h2 class="ct"><span class="n">4</span>Thinking time</h2><div class="opts">' +
      [[0, "Off"], [15, "15 sec"], [30, "30 sec"], [45, "45 sec"], [60, "1 min"]].map(function(x){ return opt("timer", x[0], x[1], S.timer === x[0]); }).join("") +
      '</div><p class="sub">A timer for each round. It beeps at the end.</p></div></div>';

    h += '<div class="card"><h2 class="ct"><span class="n">5</span>Who is playing?</h2><div class="opts">' +
      opt("mode", "class", "🙌 Whole class", S.mode === "class") + opt("mode", "teams", "👥 Teams", S.mode === "teams") + opt("mode", "solo", "🙋 Individuals", S.mode === "solo") + "</div>";
    if(S.mode === "teams"){
      h += '<div style="margin-top:.6em"><div class="stepper"><button data-act="teams" data-d="-1"' + (S.teams.length <= 1 ? " disabled" : "") + ' aria-label="Fewer teams">−</button>' +
        '<span class="v">' + S.teams.length + '</span><button data-act="teams" data-d="1"' + (S.teams.length >= 8 ? " disabled" : "") + ' aria-label="More teams">+</button></div>' +
        ' <span class="sub" style="display:inline">Tap a name to change it.</span></div><div class="teams">' +
        S.teams.map(function(tm, i){ return '<div class="teamrow"><span class="sw" style="background:' + col(i) + '"></span><input data-team="' + i + '" value="' + esc(tm.name) + '" maxlength="24" aria-label="Team ' + (i + 1) + ' name"></div>'; }).join("") + "</div>";
    } else if(S.mode === "solo"){
      h += '<p class="sub">Type each student\'s name on its own line.</p><textarea id="playersBox" class="names" rows="5" aria-label="Student names, one on each line" placeholder="One name on each line">' +
        esc(S.players.map(function(p){ return p.name; }).join("\n")) + '</textarea><p class="sub" id="playersCount">' + playersText() + "</p>";
    } else {
      h += '<p class="sub">Everyone plays together. No points.</p>';
    }
    h += "</div>";

    var pct = all ? Math.round(free / all * 100) : 0;
    h += '<div class="card"><div class="match"><h2 class="ct" style="margin:0">🎯 <b>' + all + "</b> sets match. " + (S.noRepeat ? "<b>" + free + "</b> are not used yet." : "") + "</h2>" +
      '<span class="bar"><button class="toggle" data-act="tg" data-v="noRepeat" aria-pressed="' + S.noRepeat + '">' + (S.noRepeat ? "✅" : "⬜") + " No repeats</button>" +
      (S.noRepeat ? '<button class="plain" data-act="reset">' + (confirmReset ? "⚠️ Tap again to start again" : "🔄 Start again") + "</button>" : "") + "</span></div>" +
      (S.noRepeat ? '<div class="meter"><span style="width:' + pct + '%"></span></div>' : "") +
      '<p class="sub">' + (!all ? "⚠️ Choose at least one level and one topic." :
        S.noRepeat && !free ? "⚠️ All of these sets are used. Tap Start again, or choose more topics." :
        S.noRepeat && free < S.count ? "Only " + free + " left. You will get " + free + " rounds." :
        S.noRepeat ? "Each set is used once. Start again puts them all back." : "Sets can come up again.") + "</p></div>";

    var canPlay = free && (S.mode !== "solo" || S.players.length);
    h += '<div class="bar"><button class="go" data-act="play"' + (canPlay ? "" : " disabled") + ">🎲 Start the game!</button>" +
      (S.game && S.game.idx < S.game.rounds.length ? '<button class="blue" data-act="resume">▶ Back to the game</button>' : "") + "</div>";
    if(S.mode === "solo" && !S.players.length) h += '<p class="sub" style="color:#fff;text-align:center">Type the student names first.</p>';

    h += '<div class="card"><h2 class="ct">📋 How to play</h2><ol style="margin:.2em 0 0;padding-left:1.4em">' +
      "<li>Look at the four words.</li><li>Three words go together. One word does not.</li>" +
      "<li>Talk in pairs or groups. Say which word is the odd one out and why.</li>" +
      "<li>Tap the word. Then read the reason.</li></ol></div></div>";
    app.innerHTML = h;
  }
  function playersText(){
    var n = S.players.length;
    return n ? n + (n === 1 ? " student is playing." : " students are playing.") : "No names yet.";
  }

  function renderPlay(anim){
    var g = S.game, r = g.rounds[g.idx], x = set(r.id), n = g.rounds.length, C = 2 * Math.PI * 45;
    var odd = x.w.length - 1, revealed = r.guess !== null || r.shown;
    var h = '<div class="qhead"><span class="pill">Round ' + (g.idx + 1) + " of " + n + '</span><span class="dots">' +
      g.rounds.map(function(_, i){ return '<span class="' + (i === g.idx ? "on" : i < g.idx ? "done" : "") + '"></span>'; }).join("") + "</span></div>";
    h += '<div class="playrow"><div class="card qcard lv-' + x.lv + (anim ? " pop" : "") + '">' + chipsFor(x) +
      "<h2>Which word is the odd one out?</h2><div class=\"tiles\">";
    r.order.forEach(function(wi){
      var cls = "tile";
      if(revealed){ if(wi === odd) cls += " right"; else if(wi === r.guess) cls += " wrong shake"; else cls += " dim"; }
      h += '<button class="' + cls + '" data-act="guess" data-w="' + wi + '"' + (revealed ? " disabled" : "") + ">" +
        (revealed && wi === odd ? "✓ " : revealed && wi === r.guess ? "✗ " : "") + esc(x.w[wi]) + "</button>";
    });
    h += "</div>";
    if(!revealed){
      h += '<p class="starter">💬 I think ... is the odd one out because ...</p>';
    } else {
      if(r.guess !== null) h += '<p class="verdict ' + (r.guess === odd ? "ok" : "no") + '">' + (r.guess === odd ? "🎉 Yes! Well done." : "Not this time. The answer is " + esc(x.w[odd]) + ".") + "</p>";
      h += '<div class="why pop"><b>💡 Why?</b> ' + esc(x.r) + "</div>";
      if(P().length){
        h += '<div class="who"><h3>' + (S.mode === "teams" ? "Which teams got it right?" : "Who got it right?") + '</h3><div class="tms">' +
          P().map(function(p, i){
            var on = !!r.marks[i];
            return '<button class="tm" data-act="mark" data-t="' + i + '" aria-pressed="' + on + '"><span class="nm"><span class="sw" style="background:' + col(i) + '"></span>' + esc(p.name) +
              '</span><span class="st">' + (on ? "✓ 1 point" : "Tap for 1 point") + "</span></button>";
          }).join("") + "</div></div>";
      }
    }
    h += "</div>";
    h += '<div class="side">';
    if(S.timer){
      h += '<div class="card" style="display:flex;flex-direction:column;align-items:center;gap:.4em"><div class="timerbox" id="timerbox"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="tg" x1="0" x2="1">' +
        '<stop offset="0" stop-color="#FF8A00"/><stop offset=".5" stop-color="#FF6500"/><stop offset="1" stop-color="#0091B9"/></linearGradient></defs>' +
        '<circle class="track" cx="50" cy="50" r="45" fill="none" stroke-width="10"/><circle class="bar" cx="50" cy="50" r="45" fill="none" stroke="url(#tg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + C + '"/></svg>' +
        '<div class="tt"><span class="tv"></span><small></small></div></div>' +
        (revealed ? "" : '<button class="small" data-act="timerBtn" id="timerBtn">' + (timer.running ? "⏸ Pause" : "▶ Start") + "</button>") + "</div>";
    }
    if(!revealed) h += '<button class="blue" data-act="show">👀 Show the answer</button><button class="plain" data-act="swap">🔀 Swap this set</button>';
    h += "</div></div>";
    h += '<div class="nav"><button class="plain" data-act="prev"' + (g.idx === 0 ? " disabled" : "") + '>◀ Back</button><button class="plain" data-act="home">🏠 Menu</button>' +
      (g.idx < n - 1 ? '<button class="go" data-act="next" style="min-height:68px;font-size:1em"' + (revealed ? "" : " disabled") + ">Next ▶</button>"
        : '<button class="go" data-act="finish" style="min-height:68px;font-size:1em"' + (revealed ? "" : " disabled") + ">🏁 Finish</button>") + "</div>";
    app.innerHTML = h; drawTimer();
  }

  function renderEnd(){
    var g = S.game, h = '<div class="stack">';
    var guessed = g.rounds.filter(function(r){ return r.guess !== null; });
    var right = guessed.filter(function(r){ var x = set(r.id); return r.guess === x.w.length - 1; }).length;
    h += '<div class="card" style="text-align:center"><h2 class="ct" style="justify-content:center;font-size:1.3em;margin:0">🏁 Game over!</h2>' +
      (S.mode === "class" && guessed.length ? '<p class="sub">The class tapped the right word in ' + right + " of " + guessed.length + (guessed.length === 1 ? " round." : " rounds.") + "</p>" : "") + "</div>";
    if(P().length){
      var order = P().map(function(p, i){ return {p: p, i: i}; }).sort(function(a, b){ return b.p.score - a.p.score; });
      var top = order[0].p.score, medals = ["🥇", "🥈", "🥉"], rank = 0, prev = null;
      h += '<div class="scorelist">' + order.map(function(o, k){
        if(o.p.score !== prev){ rank = k; prev = o.p.score; }
        return '<div class="srow pop' + (o.p.score === top && top > 0 ? " first" : "") + '" style="animation-delay:' + k * 70 + 'ms"><span class="rk">' + (medals[rank] || rank + 1) + '</span><span class="nm"><span class="sw" style="background:' + col(o.i) + '"></span>' + esc(o.p.name) + "</span>" +
          '<span class="adj"><button data-act="adj" data-t="' + o.i + '" data-d="-1" aria-label="Take away a point">−</button><button data-act="adj" data-t="' + o.i + '" data-d="1" aria-label="Add a point">+</button></span><span class="tot">' + o.p.score + "</span></div>";
      }).join("") + "</div>";
    }
    h += '<div class="card"><h2 class="ct">📋 The answers</h2><ul class="review">' + g.rounds.map(function(r){
      var x = set(r.id), odd = x.w.length - 1;
      return '<li class="lv-' + x.lv + '"><div class="ws">' + r.order.map(function(wi){ return wi === odd ? "<s>✓ " + esc(x.w[wi]) + "</s>" : esc(x.w[wi]); }).join(", ") + '</div><div class="r">' + esc(x.r) + "</div></li>";
    }).join("") + "</ul></div>";
    h += '<div class="bar"><button class="go" data-act="play">🎲 Play again</button><button class="plain" data-act="home">🏠 Menu</button></div></div>';
    app.innerHTML = h;
  }

  function render(anim){
    document.documentElement.style.setProperty("--fs", S.size + "px");
    document.querySelectorAll("[data-size]").forEach(function(b){ b.setAttribute("aria-pressed", +b.dataset.size === S.size ? "true" : "false"); });
    document.getElementById("soundBtn").textContent = S.sound ? "🔊" : "🔇";
    if(S.game) S.game.rounds = S.game.rounds.filter(function(r){ return set(r.id); });
    if((screen === "play" || screen === "end") && (!S.game || !S.game.rounds.length)) screen = "home";
    if(screen === "play") renderPlay(anim);
    else if(screen === "end") renderEnd();
    else { screen = "home"; renderHome(); }
  }
  function go(s){ screen = s; render(true); window.scrollTo(0, 0); }

  function addPoints(){
    var g = S.game; P().forEach(function(p){ p.score = 0; });
    g.rounds.forEach(function(r){ (r.marks || []).forEach(function(on, i){ if(on && P()[i]) P()[i].score++; }); });
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    var d = b.dataset, a = d.act;
    if(d.size){ S.size = +d.size; save(); render(false); return; }
    if(a !== "reset") confirmReset = false;
    if(a === "sound"){ S.sound = !S.sound; save(); render(false); if(S.sound) beep(660, .15); return; }
    if(a === "fs"){ window.__toggleFS(); return; }
    if(a === "level"){ S.levels[d.v] = !S.levels[d.v]; save(); render(); return; }
    if(a === "topic"){ S.topics[d.v] = !S.topics[d.v]; save(); render(); return; }
    if(a === "groupAll" || a === "groupNone"){ TOPICS.forEach(function(t){ if(t.group === d.v) S.topics[t.id] = a === "groupAll"; }); save(); render(); return; }
    if(a === "count"){ S.count = +d.v; save(); render(); return; }
    if(a === "countStep"){ S.count = Math.max(1, Math.min(MAXQ, S.count + (+d.d))); save(); render(); return; }
    if(a === "timer"){ S.timer = +d.v; save(); render(); return; }
    if(a === "tg"){ S[d.v] = !S[d.v]; save(); render(); return; }
    if(a === "mode"){ S.mode = d.v; save(); render(); return; }
    if(a === "teams"){
      if(+d.d > 0 && S.teams.length < 8) S.teams.push({name: "Team " + (S.teams.length + 1), score: 0});
      if(+d.d < 0 && S.teams.length > 1) S.teams.pop();
      save(); render(); return;
    }
    if(a === "reset"){
      if(!confirmReset){ confirmReset = true; render(); return; }
      confirmReset = false; S.used = {}; save(); render(); return;
    }
    if(a === "play"){ newGame(); window.scrollTo(0, 0); return; }
    if(a === "resume"){ go("play"); startTimer(); return; }
    if(a === "home"){ stopTimer(); go("home"); return; }
    var g = S.game;
    if(a === "guess"){
      var r = g.rounds[g.idx]; if(r.guess !== null || r.shown) return;
      r.guess = +d.w; stopTimer();
      if(r.guess === set(r.id).w.length - 1) chime(); else buzz();
      save(); render(false); return;
    }
    if(a === "show"){ var r2 = g.rounds[g.idx]; r2.shown = true; stopTimer(); beep(660, .2, "triangle", .15); save(); render(false); return; }
    if(a === "swap"){ swapRound(); return; }
    if(a === "timerBtn"){ if(timer.running){ clearInterval(timer.id); timer.left = Math.max(0, (timer.end - Date.now()) / 1000); timer.running = false; drawTimer(); } else startTimer(); return; }
    if(a === "mark"){ var r3 = g.rounds[g.idx]; r3.marks[+d.t] = !r3.marks[+d.t]; if(r3.marks[+d.t]) beep(880, .12, "triangle", .15); addPoints(); save(); render(false); return; }
    if(a === "prev"){ g.idx = Math.max(0, g.idx - 1); resetTimer(); save(); render(true); return; }
    if(a === "next"){ g.idx = Math.min(g.rounds.length - 1, g.idx + 1); resetTimer(); save(); render(true); startTimer(); return; }
    if(a === "finish"){ stopTimer(); addPoints(); chime(); go("end"); return; }
    if(a === "adj"){ var p = P()[+d.t]; p.score = Math.max(0, p.score + (+d.d)); save(); render(false); return; }
  });
  document.addEventListener("input", function(e){
    var t = e.target;
    if(t.dataset && t.dataset.team !== undefined){ S.teams[+t.dataset.team].name = t.value.trim() || ("Team " + (+t.dataset.team + 1)); save(); return; }
    if(t.id === "playersBox"){
      var seen = {};
      S.players = t.value.split(/[\n,]+/).map(function(x){ return x.trim(); })
        .filter(function(x){ if(!x || seen[x]) return false; seen[x] = 1; return true; })
        .map(function(x){ return {name: x.slice(0, 24), score: 0}; });
      save();
      var pc = document.getElementById("playersCount"); if(pc) pc.textContent = playersText();
      var pb = document.querySelector('[data-act="play"]'); if(pb) pb.disabled = !(freePool().length && S.players.length);
    }
  });
  document.addEventListener("keydown", function(e){
    if(screen !== "play" || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    var g = S.game, r = g.rounds[g.idx], rev = r.guess !== null || r.shown;
    if(e.key === "ArrowRight" && rev && g.idx < g.rounds.length - 1){ g.idx++; resetTimer(); save(); render(true); startTimer(); }
    if(e.key === "ArrowLeft" && g.idx > 0){ g.idx--; resetTimer(); save(); render(true); }
  });

  load();
  if(S.game && S.game.idx < S.game.rounds.length) screen = "home";
  render();
})();
</script>
<script>
/* full screen helper: works on desktop, Android and iPad (Safari), hides the button where full screen is not possible (iPhone) */
(function(){
  var d = document, el = d.documentElement;
  function canFS(){ return !!(d.fullscreenEnabled || d.webkitFullscreenEnabled) && !!(el.requestFullscreen || el.webkitRequestFullscreen); }
  window.__toggleFS = function(){
    try{
      if(!(d.fullscreenElement || d.webkitFullscreenElement)){
        var r = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen();
        if(r && r.catch) r.catch(function(){});
      } else {
        var x = d.exitFullscreen ? d.exitFullscreen() : d.webkitExitFullscreen();
        if(x && x.catch) x.catch(function(){});
      }
    }catch(err){}
  };
  function hide(){ if(canFS()) return; d.querySelectorAll('[data-act="fs"],#fsBtn').forEach(function(b){ b.style.display = "none"; }); }
  hide();
  try{ new MutationObserver(hide).observe(d.body, {childList:true, subtree:true}); }catch(e){}
})();
</script>
<script>
/* toolkit home button: folder on a computer, same GitHub repository, or the teachers-toolkit repository */
(function(){
  var a = document.getElementById("toolkitHome"); if(!a) return;
  var REL = "Teachers_Toolkit_Home.html", REPOS = ["/teacherstoolkit/", "/teachers-toolkit/"];
  if(location.protocol === "file:"){ a.href = REL; return; }
  var gh = location.hostname.indexOf("github.io") > -1;
  a.href = gh ? REPOS[0] : REL;
  try{
    var head = function(u){ return fetch(u, {method:"HEAD", cache:"no-store"}).then(function(r){ return r.ok; }).catch(function(){ return false; }); };
    var tryAll = function(list, i){
      if(i >= list.length){ if(gh) a.href = REPOS[0]; return; }
      head(list[i]).then(function(y){ if(y) a.href = list[i]; else tryAll(list, i + 1); });
    };
    tryAll([REL].concat(REPOS), 0);
  }catch(e){}
})();
</script>
